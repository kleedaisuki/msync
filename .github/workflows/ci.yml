name: Native platform journeys

on:
  push:
    paths: ['src/**', 'stdlib/**', 'tests/**', 'packaging/**', 'Directory.Build.props', 'global.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'stdlib/**', 'tests/**', 'packaging/**', 'Directory.Build.props', 'global.json', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Select the affected native platform
        type: choice
        options: [both, windows, linux]
        default: both
      benchmark:
        description: Compare optimized Rust and Native AOT on each native runner
        type: boolean
        default: true
      baseline_run:
        description: Optional recorded native CI run for same-host previous-C# comparison
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.platform == 'windows' && '[{"os":"windows-latest","rid":"win-x64"}]') || (inputs.platform == 'linux' && '[{"os":"ubuntu-22.04","rid":"linux-x64"}]') || '[{"os":"ubuntu-22.04","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build and exercise the actual Native AOT package
        id: package
        run: python packaging/build.py --rid ${{ matrix.rid }} --smoke
      - name: Exercise typed language, process, session and stdio editor journeys
        shell: python
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          import os
          import subprocess
          from pathlib import Path
          binary: Path = Path('artifacts/publish') / os.environ['PACKAGE_RID'] / ('msync.exe' if os.name == 'nt' else 'msync')
          subprocess.run(['python', 'packaging/platform_journeys.py', '--binary', str(binary), '--output', '.temp/platform-results'], check=True)
      - name: Exercise per-user installer ownership and upgrade lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = python packaging/build.py --version
          ./packaging/windows/test.ps1 -InstallerPath "dist/msync-$version-windows-x86_64-setup.exe"
      - name: Build the preserved optimized Rust baseline on this same runner
        id: rust
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.benchmark && steps.package.outcome == 'success' }}
        run: cargo build --release --locked --manifest-path legacy/Cargo.toml --bin msync --target-dir artifacts/legacy-target
      - name: Measure paired native product journeys without a timing quality gate
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        shell: python
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          import os
          import subprocess
          from pathlib import Path
          suffix: str = '.exe' if os.name == 'nt' else ''
          aot: Path = Path('artifacts/publish') / os.environ['PACKAGE_RID'] / ('msync' + suffix)
          rust: Path = Path('artifacts/legacy-target/release') / ('msync' + suffix)
          common: list[str] = ['python', 'tests/Performance/journeys.py', '--rust', str(rust), '--aot', str(aot), '--samples', '31', '--warmups', '3']
          subprocess.run([*common, '--files', '256', '--bytes', '4096', '--output', '.temp/platform-results/paired-cli.json'], check=True)
          subprocess.run([*common, '--case', 'check-batch', '--statements', '1024', '--output', '.temp/platform-results/paired-compiler-1024.json'], check=True)
          subprocess.run(['python', 'tests/Performance/interactive.py', '--rust', str(rust), '--aot', str(aot), '--samples', '31', '--warmups', '3', '--bindings', '128', '--output', '.temp/platform-results/paired-interactive.json'], check=True)
      - name: Fetch the recorded previous C# image for this native platform
        id: previous
        if: ${{ !cancelled() && steps.package.outcome == 'success' && inputs.benchmark && inputs.baseline_run != '' }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          import os
          import subprocess
          subprocess.run(['python', 'packaging/performance_baseline.py', '--run', os.environ['BASELINE_RUN'], '--rid', os.environ['PACKAGE_RID'], '--output', 'artifacts/previous-native', '--github-output', os.environ['GITHUB_OUTPUT']], check=True)
      - name: Measure previous and current C# on this same native runner
        if: ${{ !cancelled() && steps.previous.outcome == 'success' }}
        shell: python
        env:
          PREVIOUS_NATIVE: ${{ steps.previous.outputs.binary }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          import os
          import subprocess
          from pathlib import Path
          aot: Path = Path('artifacts/publish') / os.environ['PACKAGE_RID'] / ('msync.exe' if os.name == 'nt' else 'msync')
          common: list[str] = ['python', 'tests/Performance/journeys.py', '--previous-aot', os.environ['PREVIOUS_NATIVE'], '--aot', str(aot), '--samples', '31', '--warmups', '3']
          subprocess.run([*common, '--files', '256', '--bytes', '4096', '--output', '.temp/platform-results/paired-aot-before-after.json'], check=True)
          subprocess.run([*common, '--case', 'check-batch', '--statements', '1024', '--output', '.temp/platform-results/paired-aot-compiler-1024.json'], check=True)
          subprocess.run(['python', 'tests/Performance/interactive.py', '--previous-aot', os.environ['PREVIOUS_NATIVE'], '--aot', str(aot), '--samples', '31', '--warmups', '3', '--bindings', '128', '--output', '.temp/platform-results/paired-aot-interactive.json'], check=True)
      - name: Publish the bounded native Windows copy mechanism probe
        id: copy-probe
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.benchmark && steps.package.outcome == 'success' && hashFiles('tests/IO/WindowsCopyProbe/WindowsCopyProbe.csproj') != '' }}
        run: dotnet publish tests/IO/WindowsCopyProbe/WindowsCopyProbe.csproj -c Release -r win-x64 --artifacts-path artifacts/io-probe -o artifacts/windows-copy-probe -p:RestoreLockedMode=true
      - name: Compare Windows copy mechanisms and cancellation outside product timings
        if: ${{ !cancelled() && steps.copy-probe.outcome == 'success' }}
        run: artifacts/windows-copy-probe/WindowsCopyProbe.exe --output .temp/platform-results/windows-copy-probe.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.rid }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            dist/*
            .temp/platform-results/**
            artifacts/previous-native/baseline.json
            .temp/windows-install-test-*/**/*.log
