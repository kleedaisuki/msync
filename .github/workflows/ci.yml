name: Rust

on:
  push:
  pull_request:

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      full: ${{ steps.select.outputs.full }}
      docs: ${{ steps.select.outputs.docs }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if (-not $env:BASE -or $env:BASE -match '^0+$') {
            $env:BASE = git merge-base HEAD origin/main
          }
          ./scripts/test-ci-select.ps1
          ./scripts/ci-select.ps1 -Base $env:BASE -GitHubOutput
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.rust == 'true'
        shell: pwsh
        env:
          FULL: ${{ needs.changes.outputs.full }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          if ($env:FULL -eq 'true') {
            cargo clippy --locked --all-targets -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --all-targets
            exit $LASTEXITCODE
          }
          $targets = @($env:TARGETS | ConvertFrom-Json)
          $clippyArgs = @('clippy', '--locked', '--lib', '--bin', 'msync')
          $testArgs = @('test', '--locked', '--lib')
          foreach ($target in $targets) {
            $clippyArgs += @('--test', $target)
            $testArgs += @('--test', $target)
          }
          & cargo @clippyArgs -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo @testArgs
          exit $LASTEXITCODE
      - if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.full == 'true'
        run: cargo test --locked --doc
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'process_view_linux_v4') || contains(fromJSON(needs.changes.outputs.targets), 'program_execution_v4') || contains(fromJSON(needs.changes.outputs.targets), 'physical_execution_v4') || contains(fromJSON(needs.changes.outputs.targets), 'repl_jobs') || contains(fromJSON(needs.changes.outputs.targets), 'execution_workspace_v4'))
        name: Provision the ephemeral Linux resource-view gate
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'process_view_linux_v4'))
        name: Exercise actual Linux process-resource views
        run: cargo test --locked --test process_view_linux_v4 -- --ignored --skip view_child_fixture --nocapture
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'program_execution_v4'))
        name: Exercise actual Linux transactional program execution
        run: cargo test --locked --test program_execution_v4 -- --ignored --skip program_child_fixture --nocapture
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'physical_execution_v4'))
        name: Exercise actual Linux physical-stream consumer closure
        run: cargo test --locked --test physical_execution_v4 -- --ignored --nocapture
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'repl_jobs'))
        name: Exercise owned REPL proofs and provenance across native inputs
        run: cargo test --locked --test repl_jobs -- --ignored --nocapture
      - if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'execution_workspace_v4'))
        name: Exercise native writes into the shared user scratch namespace
        run: cargo test --locked --test execution_workspace_v4 -- --ignored --skip scratch_namespace_child_fixture --nocapture

  windows-resource-view:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'process_view_windows_v4') || contains(fromJSON(needs.changes.outputs.targets), 'program_execution_v4') || contains(fromJSON(needs.changes.outputs.targets), 'execution_workspace_v4')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision the pinned signed backend on this ephemeral runner
        shell: pwsh
        run: ./scripts/ci-install-sandboxie.ps1
      - name: Exercise actual native Windows program-resource views
        shell: pwsh
        run: |
          cargo test --locked --test process_view_windows_v4 -- --ignored --skip boxed_child_fixture --nocapture 2>&1 | Tee-Object -FilePath .temp/sandboxie-ci/journeys.log
          exit $LASTEXITCODE
      - if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'program_execution_v4')
        name: Exercise actual Windows transactional program execution
        shell: pwsh
        run: |
          cargo test --locked --test program_execution_v4 -- --ignored --skip program_child_fixture --nocapture 2>&1 | Tee-Object -FilePath .temp/sandboxie-ci/execution.log
          exit $LASTEXITCODE
      - if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.targets), 'execution_workspace_v4')
        name: Exercise actual native writes into the shared user scratch namespace
        shell: pwsh
        run: |
          cargo test --locked --test execution_workspace_v4 -- --ignored --skip scratch_namespace_child_fixture --nocapture 2>&1 | Tee-Object -FilePath .temp/sandboxie-ci/workspace.log
          exit $LASTEXITCODE
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-resource-view-diagnostics
          path: .temp/sandboxie-ci/
          if-no-files-found: ignore
