name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete Rust and documentation acceptance matrix
        type: boolean
        default: true
      baseline:
        description: Select changed contracts against this git ref when full is false
        type: string
        default: ''
      platform:
        description: Native platform to verify
        type: choice
        options: [both, windows, ubuntu]
        default: both

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      full: ${{ steps.select.outputs.full }}
      docs: ${{ steps.select.outputs.docs }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          SELECTED_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline || '' }}
        run: |
          if ($env:FORCE_FULL -eq 'true') {
            ./scripts/ci-select.ps1 -ForceFull -GitHubOutput
          } elseif ($env:SELECTED_BASELINE) {
            ./scripts/ci-select.ps1 -Base $env:SELECTED_BASELINE -GitHubOutput
          } else {
            if (-not $env:BASE -or $env:BASE -match '^0+$') {
              $env:BASE = git merge-base HEAD origin/main
            }
            ./scripts/ci-select.ps1 -Base $env:BASE -GitHubOutput
          }
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.platform == 'both') && '["ubuntu-latest","windows-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true'
        shell: pwsh
        env:
          FULL: ${{ needs.changes.outputs.full }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          if ($env:FULL -eq 'true') {
            cargo test --locked --tests --no-fail-fast
            exit $LASTEXITCODE
          }
          $targets = @($env:TARGETS | ConvertFrom-Json)
          $testArgs = @('test', '--locked', '--no-fail-fast', '--lib', '--bin', 'msync')
          foreach ($target in $targets) {
            $testArgs += @('--test', $target)
          }
          & cargo @testArgs
          exit $LASTEXITCODE
      - name: Exercise native terminal notification wakeups
        if: needs.changes.outputs.rust == 'true'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          cargo test --locked --manifest-path vendor/rustyline/Cargo.toml --no-default-features --features custom-bindings,buffer-redux --lib external_printer_
          exit $LASTEXITCODE
      - name: Exercise native SSH credential windows
        if: runner.os == 'Windows' && needs.changes.outputs.rust == 'true'
        run: cargo test --locked --test windows_askpass -- --ignored --test-threads=1
      - if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.full == 'true'
        run: cargo test --locked --doc
