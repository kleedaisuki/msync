name: Editor installation

on:
  push:
    paths: ['.github/workflows/editor.yml', 'editors/vscode/**', 'src/Msync.Cli/**', 'src/Msync.Compiler/**', 'src/Msync.Core/**', 'stdlib/**', 'Directory.Build.props', 'global.json']
  pull_request:
    paths: ['.github/workflows/editor.yml', 'editors/vscode/**', 'src/Msync.Cli/**', 'src/Msync.Compiler/**', 'src/Msync.Core/**', 'stdlib/**', 'Directory.Build.props', 'global.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MSYNC_TEST_VSCODE_VERSION: '1.144.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish native language server
        run: dotnet publish src/Msync.Cli/Msync.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/editor-server
      - name: Install and build editor
        working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm run build
      - name: Exercise real VS Code extension host
        working-directory: editors/vscode
        env:
          MSYNC_TEST_SERVER_PATH: ${{ github.workspace }}/artifacts/editor-server/msync
        run: timeout --signal=TERM --kill-after=20s 360s xvfb-run -a npm run test:integration
      - name: Package tested extension
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist/editor
          npx --yes @vscode/vsce@4.1.0 package --allow-missing-repository --out ../../dist/editor/msync-language.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msync-vscode-${{ github.sha }}
          path: dist/editor/*.vsix
