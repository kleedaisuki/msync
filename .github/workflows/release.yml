name: Release packages

on:
  push:
    branches: [main, 'codex/**']
    paths: ['Directory.Build.props', 'global.json', 'src/**', 'stdlib/**', 'packaging/**', 'editors/vscode/**', '.github/workflows/release.yml', 'docs/releases/**']
  pull_request:
    paths: ['Directory.Build.props', 'global.json', 'src/**', 'stdlib/**', 'packaging/**', 'editors/vscode/**', '.github/workflows/release.yml', 'docs/releases/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manifest version (main only; published releases are immutable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: python
        env:
          PUBLISH_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('package_build', 'packaging/build.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          version = build.version()
          assert Path(f'docs/releases/{version}.md').stat().st_size
          publish = os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] != 'pull_request' and os.environ['PUBLISH_REQUESTED'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\npublish={str(publish).lower()}\n')

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            name: linux-x86_64
          - os: windows-latest
            rid: win-x64
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the pinned Windows ConPTY fixture
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tests/Msync.EndToEnd/windows-terminal-requirements.txt
      - name: Install native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build and exercise Native AOT portable payload
        run: python packaging/build.py --rid ${{ matrix.rid }} --smoke
      - name: Exercise reorganized product boundaries
        shell: python
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          binary: Path = Path('artifacts/package') / f"msync-{os.environ['PACKAGE_VERSION']}-{os.environ['PACKAGE_NAME']}" / 'bin' / ('msync.exe' if os.name == 'nt' else 'msync')
          phases: tuple[str, ...] = ('concepts-tooling', 'library-policy', 'type-traits', 'shell-repl', 'artifact')
          arguments: list[str] = [sys.executable, 'packaging/language_upgrade.py', '--binary', str(binary.resolve())]
          for phase in phases:
              arguments.extend(('--phase', phase))
          subprocess.run(arguments, check=True)
      - name: Verify immutable installer upgrade baseline
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .temp -Force | Out-Null
          gh release download v0.4.0 --repo "$env:GITHUB_REPOSITORY" --pattern msync-0.4.0-windows-x86_64-setup.exe --output .temp/previous-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the immutable installer upgrade baseline.' }
          if ((Get-FileHash .temp/previous-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'ed22547657e0981cb282180d72342f3e6cf95ea3ceada33993b8dec9e5e03498') { throw 'Upgrade baseline digest differs.' }
          ./packaging/windows/test.ps1 -InstallerPath "dist/msync-${{ needs.version.outputs.version }}-windows-x86_64-setup.exe" -PreviousInstallerPath .temp/previous-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
      - name: Retain native acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.name }}
          if-no-files-found: ignore
          path: .temp/platform-results/language-upgrade/

  editor:
    needs: [version, native]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      MSYNC_TEST_VSCODE_VERSION: '1.144.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x86_64
          path: .temp/editor-release/input
      - name: Select packaged native server
        run: |
          mkdir -p .temp/editor-release/server
          tar -xzf ".temp/editor-release/input/msync-$PACKAGE_VERSION-linux-x86_64.tar.gz" -C .temp/editor-release/server
          echo "MSYNC_TEST_SERVER_PATH=$PWD/.temp/editor-release/server/msync-$PACKAGE_VERSION-linux-x86_64/bin/msync" >> "$GITHUB_ENV"
      - name: Install and build editor
        working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm run build
      - name: Exercise current source-language editor
        env:
          MSYNC_TEST_STANDARD_CONCEPTS_ONLY: '1'
        working-directory: editors/vscode
        shell: python
        run: |
          import subprocess

          subprocess.run(['xvfb-run', '-a', 'npm', 'run', 'test:integration'], check=True, timeout=360)
      - name: Exercise read-only bytecode editor
        env:
          MSYNC_TEST_ARTIFACT_ONLY: '1'
        working-directory: editors/vscode
        shell: python
        run: |
          import subprocess

          subprocess.run(['xvfb-run', '-a', 'npm', 'run', 'test:integration'], check=True, timeout=360)
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce@4.1.0 package --allow-missing-repository --out "../../dist/msync-language-$PACKAGE_VERSION.vsix"
      - name: Verify packaged editor payload
        shell: python
        run: |
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'packaging')
          from audit_payloads import audit_vsix

          version: str = os.environ['PACKAGE_VERSION']
          archive: Path = Path('dist') / f'msync-language-{version}.vsix'
          output: Path = Path('.temp/editor-release/payload.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'version': version, 'members': audit_vsix(archive, version)}, indent=2) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vscode
          if-no-files-found: error
          path: dist/*.vsix
      - name: Retain editor acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-vscode
          if-no-files-found: ignore
          path: |
            .temp/editor-release/payload.json
            .temp/vscode-host-*/run.json
            .temp/vscode-host-*/result.json
            .temp/vscode-host-*/host.log

  publish:
    needs: [version, native, editor]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify native manifests and executable standard sources
        shell: python
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'packaging')
          from audit_payloads import audit_native, source_files

          version: str = os.environ['PACKAGE_VERSION']
          sources: dict[str, bytes] = source_files(os.environ['GITHUB_SHA'])
          report: dict[str, object] = {
              'linux': audit_native(Path('dist') / f'msync-{version}-linux-x86_64.tar.gz', sources, False),
              'windows': audit_native(Path('dist') / f'msync-{version}-windows-x86_64.zip', sources, True),
          }
          print(json.dumps(report, indent=2))
      - name: Publish complete checksummed assets without replacing released versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const publish = require('./packaging/publish-release.cjs');
            await publish({github, context, core, version: process.env.PACKAGE_VERSION});
