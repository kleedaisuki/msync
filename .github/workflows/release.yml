name: Release packages

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - Cargo.toml
      - Cargo.lock
      - .gitattributes
      - packaging/**
      - .github/workflows/release.yml
      - docs/releases/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .gitattributes
      - packaging/**
      - .github/workflows/release.yml
      - docs/releases/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manifest version (main only; never overwrite a published release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify publication invariants
        run: node --test packaging/test-publish-release.cjs
      - id: version
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a numeric Cargo package version' >&2; exit 1; }
          test -s "docs/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request && "$PUBLISH_REQUESTED" == true ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build static-CRT portable ZIP and per-user installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Target x86_64-pc-windows-msvc -OutputDirectory dist
      - name: Exercise actual install, repair, PATH, transfer and uninstall
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/windows/test.ps1 -InstallerPath "dist/msync-$env:PACKAGE_VERSION-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: |
            dist/msync-${{ needs.version.outputs.version }}-windows-x86_64-setup.exe
            dist/msync-${{ needs.version.outputs.version }}-windows-x86_64.zip

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build and verify portable archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./packaging/linux/build.sh
          mkdir -p .temp/package-smoke
          tar -xzf "dist/msync-$PACKAGE_VERSION-linux-x86_64.tar.gz" -C .temp/package-smoke
          exe="$PWD/.temp/package-smoke/msync-$PACKAGE_VERSION-linux-x86_64/bin/msync"
          test "$("$exe" --version)" = "msync $PACKAGE_VERSION"
          mkdir -p '.temp/package-smoke/user workspace'
          cd '.temp/package-smoke/user workspace'
          printf 'fresh packaged bytes\n' > source
          printf 'macro copy_one(source, destination):\n    source -> destination\n\ncopy_one(source, destination)\n' > copy.msync
          "$exe" check copy.msync
          "$exe" run copy.msync --dry-run
          test ! -e destination
          "$exe" emit-ir copy.msync -o portable.json
          "$exe" bind-ir portable.json -o bound.json
          "$exe" plan-ir bound.json
          "$exe" compile copy.msync -o macro.mobj
          rm copy.msync
          "$exe" run macro.mobj
          cmp source destination
          rm destination
          "$exe" run-ir bound.json
          cmp source destination
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          if-no-files-found: error
          path: dist/msync-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz

  publish:
    needs: [version, windows, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete checksummed assets without replacing released versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const publish = require('./packaging/publish-release.cjs');
            await publish({github, context, core, version: process.env.PACKAGE_VERSION});
