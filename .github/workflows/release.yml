name: Release packages

on:
  push:
    branches: [main, 'codex/**']
    paths: ['Directory.Build.props', 'global.json', 'src/**', 'stdlib/**', 'packaging/**', 'editors/vscode/**', '.github/workflows/release.yml', 'docs/releases/**']
  pull_request:
    paths: ['Directory.Build.props', 'global.json', 'src/**', 'stdlib/**', 'packaging/**', 'editors/vscode/**', '.github/workflows/release.yml', 'docs/releases/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manifest version (main only; published releases are immutable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: python
        env:
          PUBLISH_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('package_build', 'packaging/build.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          version = build.version()
          assert Path(f'docs/releases/{version}.md').stat().st_size
          publish = os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] != 'pull_request' and os.environ['PUBLISH_REQUESTED'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\npublish={str(publish).lower()}\n')

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            name: linux-x86_64
          - os: windows-latest
            rid: win-x64
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build and exercise Native AOT portable payload
        run: python packaging/build.py --rid ${{ matrix.rid }} --smoke
      - name: Verify immutable installer upgrade baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .temp -Force | Out-Null
          Invoke-WebRequest 'https://github.com/kleedaisuki/msync/releases/download/v0.4.0/msync-0.4.0-windows-x86_64-setup.exe' -OutFile .temp/previous-setup.exe
          if ((Get-FileHash .temp/previous-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'ed22547657e0981cb282180d72342f3e6cf95ea3ceada33993b8dec9e5e03498') { throw 'Upgrade baseline digest differs.' }
          ./packaging/windows/test.ps1 -InstallerPath "dist/msync-${{ needs.version.outputs.version }}-windows-x86_64-setup.exe" -PreviousInstallerPath .temp/previous-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe

  editor:
    needs: [version, native]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      MSYNC_TEST_VSCODE_VERSION: '1.144.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x86_64
          path: .temp/editor-release/input
      - name: Select packaged native server
        run: |
          mkdir -p .temp/editor-release/server
          tar -xzf ".temp/editor-release/input/msync-$PACKAGE_VERSION-linux-x86_64.tar.gz" -C .temp/editor-release/server
          echo "MSYNC_TEST_SERVER_PATH=$PWD/.temp/editor-release/server/msync-$PACKAGE_VERSION-linux-x86_64/bin/msync" >> "$GITHUB_ENV"
      - name: Install and build editor
        working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm run build
      - name: Exercise installed VS Code extension host
        working-directory: editors/vscode
        run: timeout --signal=TERM --kill-after=20s 360s xvfb-run -a npm run test:integration
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          mkdir -p ../../dist
          npx --yes @vscode/vsce@4.1.0 package --allow-missing-repository --out "../../dist/msync-language-$PACKAGE_VERSION.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vscode
          if-no-files-found: error
          path: dist/*.vsix

  publish:
    needs: [version, native, editor]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete checksummed assets without replacing released versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const publish = require('./packaging/publish-release.cjs');
            await publish({github, context, core, version: process.env.PACKAGE_VERSION});
