name: Windows backend capability

on:
  push:
    branches: [codex/v0.4.0]
    paths:
      - .github/workflows/windows-backend.yml
      - scripts/ci-install-sandboxie.ps1
  workflow_dispatch:

jobs:
  signed-backend:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned backend only on this ephemeral runner
        shell: pwsh
        run: ./scripts/ci-install-sandboxie.ps1
      - name: Probe the installed native ABI without creating any sandbox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Join-Path $env:MSYNC_SANDBOXIE_HOME 'SbieDll.dll').Replace('"', '""')
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class SandboxieProbe {
              [DllImport(@"$dll", EntryPoint="SbieApi_GetVersionEx", CharSet=CharSet.Unicode, CallingConvention=CallingConvention.Winapi)]
              public static extern int Version(StringBuilder version, out uint abi);
          }
          "@
          $text = [System.Text.StringBuilder]::new(16)
          [uint32] $abi = 0
          $status = [SandboxieProbe]::Version($text, [ref] $abi)
          if ($status -ne 0 -or $text.Length -eq 0) { throw ('Native version query failed: NTSTATUS 0x{0:X8}' -f $status) }
          "Native version: $text; ABI: $abi"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-backend-capability-diagnostics
          path: .temp/sandboxie-ci/
          if-no-files-found: ignore
