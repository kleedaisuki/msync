name: Windows tree I/O benchmark

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-tree-io-bench, codex/windows-tree-io-ntfs]

permissions:
  contents: read

jobs:
  windows-tree:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Freeze the Windows release image and publish the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .temp/windows-tree-inputs -Force
          gh release download v0.9.2 --pattern msync-0.9.2-windows-x86_64.zip --dir .temp/windows-tree-inputs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive .temp/windows-tree-inputs/msync-0.9.2-windows-x86_64.zip .temp/windows-tree-inputs/baseline
          $baseline = Get-ChildItem .temp/windows-tree-inputs/baseline -Filter msync.exe -Recurse | Select-Object -First 1
          if (!$baseline) { throw 'Missing baseline binary' }
          "MSYNC_BENCH_BASELINE=$($baseline.FullName)" >> $env:GITHUB_ENV
          dotnet publish src/Msync.Cli/Msync.Cli.csproj -c Release -r win-x64 -o .temp/windows-tree-inputs/current -p:RestoreLockedMode=true
      - name: Measure NTFS source deployments
        run: |
          Get-Volume -DriveLetter (Get-Location).Drive.Name | Format-List FileSystem,DriveLetter
          python tests/Performance/windows_tree.py --binary .temp/windows-tree-inputs/current/msync.exe --baseline "$env:MSYNC_BENCH_BASELINE" --work .temp/windows-tree-local
      - name: Check native Windows queued publication metadata and failure ownership
        if: ${{ github.ref_name == 'codex/windows-tree-io-ntfs' }}
        run: python tests/IO/windows_tree_publication.py .temp/windows-tree-inputs/current/msync.exe
      - name: Measure native Windows OpenSSH against an owned WSL1 receiver
        if: ${{ success() && github.ref_name != 'codex/windows-tree-io-ntfs' }}
        run: python tests/Performance/windows_tree.py --binary .temp/windows-tree-inputs/current/msync.exe --baseline "$env:MSYNC_BENCH_BASELINE" --work .temp/windows-tree-ssh --wsl --remote-only
      - name: Measure native Windows OpenSSH against the configured two-host scratch peer
        if: ${{ !cancelled() && github.ref_name != 'codex/windows-tree-io-ntfs' }}
        env:
          MSYNC_TREE_PEER: ${{ secrets.MSYNC_TREE_BENCH_EPHEMERAL }}
        run: |
          if (!$env:MSYNC_TREE_PEER) { Write-Output 'No external scratch peer configured.'; exit 0 }
          $peer = $env:MSYNC_TREE_PEER | ConvertFrom-Json
          $path = (New-Item -ItemType Directory -Path .temp/windows-tree-credentials -Force).FullName
          $utf8 = [Text.UTF8Encoding]::new($false)
          $key = "$path/id"
          $known = "$path/known"
          $config = "$path/config"
          [IO.File]::WriteAllText($key, $peer.key, $utf8)
          [IO.File]::WriteAllText($known, $peer.known_hosts, $utf8)
          icacls.exe $key /inheritance:r /grant:r "$(whoami):(F)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $keyUnix = $key.Replace('\', '/')
          $knownUnix = $known.Replace('\', '/')
          [IO.File]::WriteAllLines($config, @(
            'Host Perf_Fixture', " HostName $($peer.address)", " Port $($peer.port)",
            ' User bench', " IdentityFile `"$keyUnix`"", " UserKnownHostsFile `"$knownUnix`"",
            ' IdentityAgent none', ' IdentitiesOnly yes', ' StrictHostKeyChecking yes',
            ' BatchMode yes', ' ConnectTimeout 10', ' ConnectionAttempts 1', ' ControlMaster no',
            ' ControlPath none', ' GlobalKnownHostsFile none', ' LogLevel ERROR'
          ), $utf8)
          try {
            python tests/Performance/windows_tree.py --binary .temp/windows-tree-inputs/current/msync.exe --baseline "$env:MSYNC_BENCH_BASELINE" --work .temp/windows-tree-external --ssh-config $config --remote-root /home/bench --remote-only
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $path -Recurse -Force
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-tree-receipts
          include-hidden-files: true
          path: |
            .temp/windows-tree-*/*.sqlite
            .temp/windows-tree-*/*.jsonl
            .temp/windows-tree-*/environment.json
