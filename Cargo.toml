[package]
name = "msync"
version = "0.5.0"
edition = "2024"
description = "A compiled file synchronization DSL with an interactive shell"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
regex = "1.12"
regex-syntax = "0.8"
url = "2.5"
same-file = "1.0"
unicode-width = "0.2"
anstream = "1.0"
rustyline = { version = "19", default-features = false, features = ["custom-bindings", "buffer-redux"] }
tokio = { version = "1.54", features = ["fs", "io-util", "net", "time", "sync", "rt-multi-thread", "macros", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Console", "Wdk_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_Globalization", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming", "Win32_Security"] }
socket2 = "0.6"

[dev-dependencies]
tempfile = "3.23"
proptest = "1.9"
socket2 = "0.6"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "planner"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "latency_v4"
harness = false

[[bench]]
name = "planner_v4"
harness = false
